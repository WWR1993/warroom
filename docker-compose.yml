version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: warroom
      POSTGRES_PASSWORD: warroom
      POSTGRES_DB: warroom
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://warroom:warroom@db:5432/warroom
      POLL_INTERVAL: 60
      FEEDS: |
        https://rss.cnn.com/rss/edition.rss|CNN
        https://feeds.bbci.co.uk/news/world/rss.xml|BBC
        https://www.reddit.com/r/worldnews/.rss|RedditWorld
    depends_on:
      - db
volumes:
  pgdata:
